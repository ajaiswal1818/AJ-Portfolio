document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

<\u002Fdiv>\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: {{ m.labelColor }}; white-space: nowrap; transition: color 400ms ease\">{{ m.label }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"position: absolute; bottom: 56px; left: {{ walkerLeft }}; transition: left 120ms linear\">\n        <div style=\"position: relative; width: 0; height: 0; animation: bob 0.72s linear infinite; animation-play-state: {{ playState }}\">\n          <div style=\"position: absolute; left: -4.5px; bottom: 27px; width: 9px; height: 9px; border-radius: 50%; background: oklch(0.94 0.006 85)\"><\u002Fdiv>\n          <div style=\"position: absolute; left: -1px; bottom: 13px; width: 2px; height: 15px; background: oklch(0.94 0.006 85)\"><\u002Fdiv>\n          <div style=\"position: absolute; left: -1px; bottom: 22px; width: 2px; height: 11px; transform-origin: top center; background: oklch(0.6 0.01 85); animation: armBack 0.72s ease-in-out infinite; animation-play-state: {{ playState }}\"><\u002Fdiv>\n          <div style=\"position: absolute; left: -1px; bottom: 22px; width: 2px; height: 11px; transform-origin: top center; background: oklch(0.94 0.006 85); animation: armFront 0.72s ease-in-out infinite; animation-play-state: {{ playState }}\"><\u002Fdiv>\n          <div style=\"position: absolute; left: -1px; bottom: 0px; width: 2px; height: 14px; transform-origin: top center; background: oklch(0.6 0.01 85); animation: legBack 0.72s ease-in-out infinite; animation-play-state: {{ playState }}\"><\u002Fdiv>\n          <div style=\"position: absolute; left: -1px; bottom: 0px; width: 2px; height: 14px; transform-origin: top center; background: oklch(0.94 0.006 85); animation: legFront 0.72s ease-in-out infinite; animation-play-state: {{ playState }}\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position: absolute; left: -13px; bottom: -2px; width: 26px; height: 4px; border-radius: 50%; background: oklch(0.26 0.014 268)\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"journey-viewport\" style=\"position: relative; z-index: 1; height: 100vh; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth\">\n<div id=\"journey-scope\">\n\n  <header style=\"position: sticky; top: 0; z-index: 20; background: linear-gradient(oklch(0.28 0.02 265 / 0.5), oklch(0.2 0.016 265 / 0.38)); backdrop-filter: blur(22px) saturate(150%); -webkit-backdrop-filter: blur(22px) saturate(150%); border-bottom: 1px solid oklch(0.95 0.01 265 / 0.1); box-shadow: inset 0 1px 0 oklch(0.98 0.01 85 / 0.14)\">\n    <div style=\"max-width: 1304px; margin: 0 auto; padding: 18px 48px; display: flex; align-items: baseline; justify-content: space-between; gap: 32px\">\n      <a href=\"#top\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: oklch(0.94 0.006 85)\">AJ — Abhishek&nbsp;Jaiswal<\u002Fa>\n      <nav style=\"display: flex; gap: 26px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase\">\n        <a href=\"#systems\" style=\"color: oklch(0.66 0.01 85)\" style-hover=\"color: oklch(0.94 0.006 85)\">Systems<\u002Fa>\n        <a href=\"#about\" style=\"color: oklch(0.66 0.01 85)\" style-hover=\"color: oklch(0.94 0.006 85)\">About<\u002Fa>\n        <a href=\"#projects\" style=\"color: oklch(0.66 0.01 85)\" style-hover=\"color: oklch(0.94 0.006 85)\">Projects<\u002Fa>\n        <a href=\"#notes\" style=\"color: oklch(0.66 0.01 85)\" style-hover=\"color: oklch(0.94 0.006 85)\">Notes<\u002Fa>\n        <a href=\"#contact\" style=\"color: oklch(0.66 0.01 85)\" style-hover=\"color: oklch(0.94 0.006 85)\">Contact<\u002Fa>\n      <\u002Fnav>\n      <a href=\"./resume.pdf\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; border-bottom: 1px solid oklch(0.8 0.13 75 / 0.5); padding-bottom: 2px\">Résumé ↓<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section id=\"top\" style=\"max-width: 1304px; margin: 0 auto; padding: 64px 48px 150px; min-height: calc(100vh - 226px); display: flex; flex-direction: column; justify-content: center\">\n    <div style=\"display: flex; align-items: center; gap: 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.06em; color: oklch(0.68 0.01 85)\">\n      <span style=\"width: 7px; height: 7px; border-radius: 50%; background: oklch(0.74 0.17 145); animation: pulse 2.4s ease-in-out infinite\"><\u002Fspan>\n      Available for senior &amp; staff backend roles\n      <span style=\"width: 20px; height: 1px; background: oklch(0.36 0.012 265)\"><\u002Fspan>\n      <span>Bengaluru → Barcelona<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"margin: 22px 0 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: clamp(40px, min(8.6vw, 10.2vh), 104px); line-height: 0.92; letter-spacing: -0.025em; text-wrap: balance; max-width: 15ch\">\n      I build the systems you never see <em style=\"font-style: italic; color: oklch(0.8 0.13 75)\">working<\u002Fem>.\n    <\u002Fh1>\n    <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; margin: 30px 0 0; flex-wrap: wrap\">\n      <p style=\"margin: 0; font-size: 17px; line-height: 1.58; color: oklch(0.76 0.008 85); max-width: 42ch; text-wrap: pretty\">\n        Kernel-level networking on 200,000+ edge devices, then AI-agentic infrastructure at a million requests a day. Two of those systems, drawn below as they were built.\n      <\u002Fp>\n      <div style=\"display: flex; gap: 12px\">\n        <a href=\"#systems\" style=\"padding: 14px 24px; background: oklch(0.8 0.13 75); color: oklch(0.16 0.014 268); font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; transition: transform 140ms ease\" style-hover=\"transform: translateY(-2px); color: oklch(0.16 0.014 268)\">Walk the systems ↓<\u002Fa>\n        <a href=\"./resume.pdf\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"padding: 14px 24px; border: 1px solid oklch(0.38 0.012 265); color: oklch(0.88 0.006 85); font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; transition: border-color 140ms ease\" style-hover=\"border-color: oklch(0.8 0.13 75); color: oklch(0.94 0.006 85)\">Résumé<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"padding: 16px 0; border-top: 1px solid oklch(0.95 0.01 265 / 0.1); border-bottom: 1px solid oklch(0.95 0.01 265 / 0.1); background: linear-gradient(oklch(0.28 0.02 265 / 0.32), oklch(0.19 0.016 265 / 0.2)); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); overflow: hidden; white-space: nowrap\">\n    <div style=\"display: inline-flex; animation: marquee 30s linear infinite; will-change: transform\">\n      <span style=\"display: inline-flex; gap: 40px; padding-right: 40px; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.6 0.01 85)\">\n        <span>1M req/day<\u002Fspan><span style=\"color: oklch(0.8 0.13 75)\">✦<\u002Fspan><span>200K edge devices<\u002Fspan><span style=\"color: oklch(0.8 0.13 75)\">✦<\u002Fspan><span>+45% agent accuracy<\u002Fspan><span style=\"color: oklch(0.8 0.13 75)\">✦<\u002Fspan><span>5→90% coverage<\u002Fspan><span style=\"color: oklch(0.8 0.13 75)\">✦<\u002Fspan><span>10K threats blocked / mo<\u002Fspan><span style=\"color: oklch(0.8 0.13 75)\">✦<\u002Fspan><span>Python · C · FastAPI · K8s<\u002Fspan><span style=\"color: oklch(0.8 0.13 75)\">✦<\u002Fspan>\n      <\u002Fspan>\n      <span style=\"display: inline-flex; gap: 40px; padding-right: 40px; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.6 0.01 85)\">\n        <span>1M req/day<\u002Fspan><span style=\"color: oklch(0.8 0.13 75)\">✦<\u002Fspan><span>200K edge devices<\u002Fspan><span style=\"color: oklch(0.8 0.13 75)\">✦<\u002Fspan><span>+45% agent accuracy<\u002Fspan><span style=\"color: oklch(0.8 0.13 75)\">✦<\u002Fspan><span>5→90% coverage<\u002Fspan><span style=\"color: oklch(0.8 0.13 75)\">✦<\u002Fspan><span>10K threats blocked / mo<\u002Fspan><span style=\"color: oklch(0.8 0.13 75)\">✦<\u002Fspan><span>Python · C · FastAPI · K8s<\u002Fspan><span style=\"color: oklch(0.8 0.13 75)\">✦<\u002Fspan>\n      <\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <section id=\"systems\" style=\"max-width: 1304px; margin: 0 auto; padding: 104px 48px 0\">\n    <div style=\"display: flex; align-items: baseline; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid oklch(0.44 0.012 265)\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: oklch(0.8 0.13 75)\">01<\u002Fspan>\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: oklch(0.88 0.006 85)\">Systems I built<\u002Fspan>\n      <span style=\"margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.6 0.01 85)\">Scroll — the diagram assembles itself<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 64px; margin: 40px 0 0; align-items: start\">\n      <div style=\"position: sticky; top: 84px; padding: 20px 22px 18px; border: 1px solid oklch(0.95 0.01 265 / 0.12); background: linear-gradient(oklch(0.3 0.02 265 / 0.4), oklch(0.19 0.016 265 / 0.28)); backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%); box-shadow: inset 0 1px 0 oklch(0.98 0.01 85 / 0.16), 0 16px 44px oklch(0.1 0.01 265 / 0.45)\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-bottom: 13px; border-bottom: 1px solid oklch(0.95 0.01 265 / 0.1)\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.88 0.006 85)\">Knowl · request path<\u002Fdiv>\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.8 0.13 75)\">1M req / day<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; margin: 14px 0 0\">\n          <sc-for list=\"{{ knowlNodes }}\" as=\"n\" hint-placeholder-count=\"4\">\n            <div>\n              <div style=\"display: flex; align-items: center; gap: 14px; padding: 10px 14px; border: 1px solid {{ n.border }}; background: {{ n.bg }}; box-shadow: {{ n.glow }}; transition: all 420ms ease\">\n                <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: {{ n.numColor }}; transition: color 420ms ease\">{{ n.num }}<\u002Fdiv>\n                <div style=\"flex: 1\">\n                  <div style=\"font-size: 14.5px; font-weight: 500; color: {{ n.titleColor }}; transition: color 420ms ease\">{{ n.title }}<\u002Fdiv>\n                  <div style=\"margin: 3px 0 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{ n.subColor }}; transition: color 420ms ease\">{{ n.sub }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ n.hasLink }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"position: relative; height: 17px; margin-left: 28px\">\n                  <div style=\"position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: {{ n.linkColor }}; transition: background 420ms ease\"><\u002Fdiv>\n                  <div style=\"position: absolute; left: -2.5px; width: 6px; height: 6px; border-radius: 50%; background: {{ n.packetColor }}; animation: packet {{ n.packetDur }} linear infinite; animation-play-state: {{ n.packetState }}\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <h2 style=\"margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 46px; line-height: 1.06; letter-spacing: -0.02em\">Knowl — an AI-native backend at a million requests a day<\u002Fh2>\n        <div style=\"display: flex; gap: 20px; margin: 18px 0 0; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: oklch(0.62 0.01 85)\">\n          <span>Founding Engineer<\u002Fspan><span>Nov 2025 — Jan 2026<\u002Fspan><span>Python · FastAPI · Redis · GKE<\u002Fspan>\n        <\u002Fdiv>\n\n        <article data-case=\"knowl\" data-step=\"0\" style=\"min-height: 68vh; display: flex; flex-direction: column; justify-content: center; padding: 40px 0\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.8 0.13 75)\">01 — The problem<\u002Fdiv>\n          <p style=\"margin: 16px 0 0; font-size: 18px; line-height: 1.66; color: oklch(0.82 0.008 85); text-wrap: pretty\">An AI-native product with no backend yet, and traffic that would reach a million requests a day. As the founding engineer I owned the whole path: what the API promised, where it ran, and what happened when a model call was slow, wrong, or down.<\u002Fp>\n          <p style=\"margin: 18px 0 0; font-size: 16px; line-height: 1.68; color: oklch(0.68 0.008 85); text-wrap: pretty\">The hard part of AI infrastructure isn't calling a model. It's everything around the call — contracts, backpressure, and the fallback path for when reasoning fails.<\u002Fp>\n        <\u002Farticle>\n\n        <article data-case=\"knowl\" data-step=\"1\" style=\"min-height: 68vh; display: flex; flex-direction: column; justify-content: center; padding: 40px 0\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.8 0.13 75)\">02 — Contracts first<\u002Fdiv>\n          <p style=\"margin: 16px 0 0; font-size: 18px; line-height: 1.66; color: oklch(0.82 0.008 85); text-wrap: pretty\">A FastAPI gateway with Pydantic-validated contracts at the edge of every service, across a reactive microservice architecture on hybrid AWS EC2 and GKE.<\u002Fp>\n          <p style=\"margin: 18px 0 0; font-size: 16px; line-height: 1.68; color: oklch(0.68 0.008 85); text-wrap: pretty\">Validating at the boundary means a malformed request dies in microseconds instead of surfacing as a confusing model output four services later.<\u002Fp>\n          <div style=\"margin: 22px 0 0; padding: 16px 18px; border-left: 2px solid oklch(0.8 0.13 75); background: oklch(0.3 0.02 265 / 0.28); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px)\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.8 0.13 75)\">Trade-off<\u002Fdiv>\n            <p style=\"margin: 8px 0 0; font-size: 15px; line-height: 1.6; color: oklch(0.8 0.008 85)\">Hybrid EC2 + GKE meant two deployment stories to maintain. We took that cost to keep stateful services on predictable instances while bursty agent workers scaled on Kubernetes.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <article data-case=\"knowl\" data-step=\"2\" style=\"min-height: 68vh; display: flex; flex-direction: column; justify-content: center; padding: 40px 0\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.8 0.13 75)\">03 — Holding the line under load<\u002Fdiv>\n          <p style=\"margin: 16px 0 0; font-size: 18px; line-height: 1.66; color: oklch(0.82 0.008 85); text-wrap: pretty\">Redis-backed rate limiting and throttling in front of the expensive paths, tuned against P95 rather than averages — the tail is what takes a service down.<\u002Fp>\n          <p style=\"margin: 18px 0 0; font-size: 16px; line-height: 1.68; color: oklch(0.68 0.008 85); text-wrap: pretty\">Model calls cost real money and real latency. Shedding load early keeps the system honest instead of quietly queueing until everything times out at once.<\u002Fp>\n          <div style=\"margin: 22px 0 0; padding: 16px 18px; border-left: 2px solid oklch(0.8 0.13 75); background: oklch(0.3 0.02 265 / 0.28); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px)\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.8 0.13 75)\">Trade-off<\u002Fdiv>\n            <p style=\"margin: 8px 0 0; font-size: 15px; line-height: 1.6; color: oklch(0.8 0.008 85)\">Rejecting a request is worse than serving it — but far better than degrading every request in flight. We chose visible, bounded failure over invisible collapse.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <article data-case=\"knowl\" data-step=\"3\" style=\"min-height: 68vh; display: flex; flex-direction: column; justify-content: center; padding: 40px 0\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.8 0.13 75)\">04 — The agent that reasons, then falls back<\u002Fdiv>\n          <p style=\"margin: 16px 0 0; font-size: 18px; line-height: 1.66; color: oklch(0.82 0.008 85); text-wrap: pretty\">An autonomous agentic system for language detection: LLM reasoning first, then a multi-strategy fallback ladder when confidence is low. Prompt engineering on the reasoning step lifted accuracy <strong style=\"color: oklch(0.94 0.006 85); font-weight: 600\">45%<\u002Fstrong>.<\u002Fp>\n          <div style=\"display: flex; gap: 1px; margin: 26px 0 0; background: oklch(0.95 0.01 265 / 0.12); border: 1px solid oklch(0.95 0.01 265 / 0.12)\">\n            <div style=\"flex: 1; padding: 18px 20px; background: linear-gradient(oklch(0.3 0.02 265 / 0.4), oklch(0.19 0.016 265 / 0.26))\">\n              <div style=\"font-family: 'Instrument Serif', Georgia, serif; font-size: 42px; line-height: 1; color: oklch(0.8 0.13 75)\">+45%<\u002Fdiv>\n              <div style=\"margin: 10px 0 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.66 0.01 85)\">Detection accuracy<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex: 1; padding: 18px 20px; background: linear-gradient(oklch(0.3 0.02 265 / 0.4), oklch(0.19 0.016 265 / 0.26))\">\n              <div style=\"font-family: 'Instrument Serif', Georgia, serif; font-size: 42px; line-height: 1\">1M+<\u002Fdiv>\n              <div style=\"margin: 10px 0 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.66 0.01 85)\">Requests / day served<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin: 22px 0 0; padding: 16px 18px; border-left: 2px solid oklch(0.8 0.13 75); background: oklch(0.3 0.02 265 / 0.28); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px)\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.8 0.13 75)\">Trade-off<\u002Fdiv>\n            <p style=\"margin: 8px 0 0; font-size: 15px; line-height: 1.6; color: oklch(0.8 0.008 85)\">LLM reasoning is slower and pricier than a classifier. It earns its place only because the fallback ladder catches the low-confidence tail — the agent is allowed to be uncertain, not allowed to be wrong silently.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 64px; margin: 120px 0 0; align-items: start\">\n      <div style=\"position: sticky; top: 84px; padding: 20px 22px 18px; border: 1px solid oklch(0.95 0.01 265 / 0.12); background: linear-gradient(oklch(0.3 0.02 265 / 0.4), oklch(0.19 0.016 265 / 0.28)); backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%); box-shadow: inset 0 1px 0 oklch(0.98 0.01 85 / 0.16), 0 16px 44px oklch(0.1 0.01 265 / 0.45)\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-bottom: 13px; border-bottom: 1px solid oklch(0.95 0.01 265 / 0.1)\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.88 0.006 85)\">VeloCloud · telemetry path<\u002Fdiv>\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.8 0.13 75)\">200K devices<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; margin: 14px 0 0\">\n          <sc-for list=\"{{ vmwNodes }}\" as=\"n\" hint-placeholder-count=\"4\">\n            <div>\n              <div style=\"display: flex; align-items: center; gap: 14px; padding: 10px 14px; border: 1px solid {{ n.border }}; background: {{ n.bg }}; box-shadow: {{ n.glow }}; transition: all 420ms ease\">\n                <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: {{ n.numColor }}; transition: color 420ms ease\">{{ n.num }}<\u002Fdiv>\n                <div style=\"flex: 1\">\n                  <div style=\"font-size: 14.5px; font-weight: 500; color: {{ n.titleColor }}; transition: color 420ms ease\">{{ n.title }}<\u002Fdiv>\n                  <div style=\"margin: 3px 0 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{ n.subColor }}; transition: color 420ms ease\">{{ n.sub }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ n.hasLink }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"position: relative; height: 17px; margin-left: 28px\">\n                  <div style=\"position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: {{ n.linkColor }}; transition: background 420ms ease\"><\u002Fdiv>\n                  <div style=\"position: absolute; left: -2.5px; width: 6px; height: 6px; border-radius: 50%; background: {{ n.packetColor }}; animation: packet {{ n.packetDur }} linear infinite; animation-play-state: {{ n.packetState }}\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <h2 style=\"margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 46px; line-height: 1.06; letter-spacing: -0.02em\">VMware VeloCloud — seeing 200,000 edge devices at once<\u002Fh2>\n        <div style=\"display: flex; gap: 20px; margin: 18px 0 0; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: oklch(0.62 0.01 85)\">\n          <span>MTS 2<\u002Fspan><span>Jul 2021 — Oct 2025<\u002Fspan><span>C · C++ · TCP/IP · Linux<\u002Fspan>\n        <\u002Fdiv>\n\n        <article data-case=\"vmware\" data-step=\"0\" style=\"min-height: 68vh; display: flex; flex-direction: column; justify-content: center; padding: 40px 0\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.8 0.13 75)\">01 — The problem<\u002Fdiv>\n          <p style=\"margin: 16px 0 0; font-size: 18px; line-height: 1.66; color: oklch(0.82 0.008 85); text-wrap: pretty\">SD-WAN edge devices in more than 200,000 deployments, and no real-time picture of what their network interfaces were doing. When a customer link degraded, support was guessing.<\u002Fp>\n          <p style=\"margin: 18px 0 0; font-size: 16px; line-height: 1.68; color: oklch(0.68 0.008 85); text-wrap: pretty\">Constraints that shape everything: appliances with limited memory, production C, and no tolerance for a telemetry path that slows down packet forwarding.<\u002Fp>\n        <\u002Farticle>\n\n        <article data-case=\"vmware\" data-step=\"1\" style=\"min-height: 68vh; display: flex; flex-direction: column; justify-content: center; padding: 40px 0\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.8 0.13 75)\">02 — Down to the kernel<\u002Fdiv>\n          <p style=\"margin: 16px 0 0; font-size: 18px; line-height: 1.66; color: oklch(0.82 0.008 85); text-wrap: pretty\">I built interface tracking from kernel-level data extraction upward — reading state where it actually lives, in C, on the device.<\u002Fp>\n          <p style=\"margin: 18px 0 0; font-size: 16px; line-height: 1.68; color: oklch(0.68 0.008 85); text-wrap: pretty\">I also built a packet-processing latency visualization platform on the same telemetry, which cut performance debugging from guesswork to a graph.<\u002Fp>\n          <div style=\"margin: 22px 0 0; padding: 16px 18px; border-left: 2px solid oklch(0.8 0.13 75); background: oklch(0.3 0.02 265 / 0.28); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px)\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.8 0.13 75)\">Trade-off<\u002Fdiv>\n            <p style=\"margin: 8px 0 0; font-size: 15px; line-height: 1.6; color: oklch(0.8 0.008 85)\">Kernel-level extraction is harder to write and riskier to ship than polling userspace tools — but it's the only way to get accurate state without paying a per-poll cost on every device in the fleet.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <article data-case=\"vmware\" data-step=\"2\" style=\"min-height: 68vh; display: flex; flex-direction: column; justify-content: center; padding: 40px 0\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.8 0.13 75)\">03 — End to end, to the dashboard<\u002Fdiv>\n          <p style=\"margin: 16px 0 0; font-size: 18px; line-height: 1.66; color: oklch(0.82 0.008 85); text-wrap: pretty\">I owned the path all the way to the operator's screen: aggregation across the fleet, then the user-facing dashboard that made 200,000 devices legible in real time.<\u002Fp>\n          <p style=\"margin: 18px 0 0; font-size: 16px; line-height: 1.68; color: oklch(0.68 0.008 85); text-wrap: pretty\">And I designed IPv6 DHCP Prefix Delegation for dynamic allocation across large deployments, giving customers globally routable addressing with zero NAT.<\u002Fp>\n        <\u002Farticle>\n\n        <article data-case=\"vmware\" data-step=\"3\" style=\"min-height: 68vh; display: flex; flex-direction: column; justify-content: center; padding: 40px 0\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.8 0.13 75)\">04 — Defence, and the discipline behind it<\u002Fdiv>\n          <p style=\"margin: 16px 0 0; font-size: 18px; line-height: 1.66; color: oklch(0.82 0.008 85); text-wrap: pretty\">Advanced Threat Protection on the same edge: IDS/IPS, threat intelligence and URL filtering, mitigating <strong style=\"color: oklch(0.94 0.006 85); font-weight: 600\">10,000+<\u002Fstrong> malicious connection attempts a month.<\u002Fp>\n          <p style=\"margin: 18px 0 0; font-size: 16px; line-height: 1.68; color: oklch(0.68 0.008 85); text-wrap: pretty\">None of it ships safely without tests. I led the introduction of a unit testing framework into a legacy C codebase and took coverage from 5% to 90%, which is what finally made full CI automation possible.<\u002Fp>\n          <div style=\"display: flex; gap: 1px; margin: 26px 0 0; background: oklch(0.95 0.01 265 / 0.12); border: 1px solid oklch(0.95 0.01 265 / 0.12)\">\n            <div style=\"flex: 1; padding: 18px 20px; background: linear-gradient(oklch(0.3 0.02 265 / 0.4), oklch(0.19 0.016 265 / 0.26))\">\n              <div style=\"font-family: 'Instrument Serif', Georgia, serif; font-size: 42px; line-height: 1\">200K<span style=\"font-size: 22px; color: oklch(0.6 0.01 85)\">+<\u002Fspan><\u002Fdiv>\n              <div style=\"margin: 10px 0 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.66 0.01 85)\">Devices with live visibility<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex: 1; padding: 18px 20px; background: linear-gradient(oklch(0.3 0.02 265 / 0.4), oklch(0.19 0.016 265 / 0.26))\">\n              <div style=\"font-family: 'Instrument Serif', Georgia, serif; font-size: 42px; line-height: 1; color: oklch(0.8 0.13 75)\">5→90%<\u002Fdiv>\n              <div style=\"margin: 10px 0 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.66 0.01 85)\">Legacy C test coverage<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin: 22px 0 0; padding: 16px 18px; border-left: 2px solid oklch(0.8 0.13 75); background: oklch(0.3 0.02 265 / 0.28); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px)\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(0.8 0.13 75)\">Trade-off<\u002Fdiv>\n            <p style=\"margin: 8px 0 0; font-size: 15px; line-height: 1.6; color: oklch(0.8 0.008 85)\">Retro-fitting tests onto legacy C meant months not shipping features, and refactoring code no one wanted to touch. The payoff was CI that could actually gate a release.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"about\" style=\"max-width: 1304px; margin: 0 auto; padding: 120px 48px 0\">\n    <div style=\"display: flex; align-items: baseline; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid oklch(0.44 0.012 265)\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: oklch(0.8 0.13 75)\">02<\u002Fspan>\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: oklch(0.88 0.006 85)\">About<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 72px; margin: 48px 0 0\">\n      <div>\n        <h2 style=\"margin: 0 0 26px; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 44px; line-height: 1.08; letter-spacing: -0.015em; max-width: 24ch\">Backend engineer for problems with <em style=\"font-style: italic; color: oklch(0.8 0.13 75)\">real constraints<\u002Fem>.<\u002Fh2>\n        <div style=\"display: flex; flex-direction: column; gap: 18px; font-size: 16.5px; line-height: 1.72; color: oklch(0.76 0.008 85); max-width: 62ch\">\n          <p style=\"margin: 0; text-wrap: pretty\">I like problems where the constraints are real: limited memory, strict latency budgets, traffic that won't wait for you to scale up. Day to day that means owning technical decisions, defining API contracts, and mentoring the engineers around me as much as it means writing code.<\u002Fp>\n          <p style=\"margin: 0; text-wrap: pretty\">I studied Computer Science at <strong style=\"font-weight: 600; color: oklch(0.94 0.006 85)\">IIT Guwahati<\u002Fstrong> and still keep my competitive programming sharp — Codeforces Expert, CodeChef 4★. Outside work I run local LLMs on a Mac Mini and write about what I find.<\u002Fp>\n          <p style=\"margin: 0; text-wrap: pretty\">I'm relocating to Barcelona and looking for senior or staff backend work, ideally where AI systems meet real infrastructure constraints.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <dl style=\"margin: 0; display: flex; flex-direction: column; align-self: start; position: sticky; top: 92px; padding: 6px 22px 18px; border: 1px solid oklch(0.95 0.01 265 / 0.1); background: linear-gradient(oklch(0.28 0.02 265 / 0.32), oklch(0.19 0.016 265 / 0.2)); backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: inset 0 1px 0 oklch(0.98 0.01 85 / 0.12)\">\n        <div style=\"display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 16px; padding: 15px 0; border-top: 1px solid oklch(0.95 0.01 265 / 0.08)\">\n          <dt style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.62 0.01 85)\">Location<\u002Fdt>\n          <dd style=\"margin: 0; font-size: 14.5px; line-height: 1.55; color: oklch(0.88 0.006 85)\">Bengaluru, India → Barcelona, Spain<\u002Fdd>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 16px; padding: 15px 0; border-top: 1px solid oklch(0.95 0.01 265 / 0.08)\">\n          <dt style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.62 0.01 85)\">Visa<\u002Fdt>\n          <dd style=\"margin: 0; font-size: 14.5px; line-height: 1.55; color: oklch(0.88 0.006 85)\">HQP (company-sponsored)<br>Digital Nomad (self-sponsored, no company action)<\u002Fdd>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 16px; padding: 15px 0; border-top: 1px solid oklch(0.95 0.01 265 / 0.08)\">\n          <dt style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: oklch(0.62 0.01 85)\">Languages<\u002Fdt>\n          <dd style=\"margin: 0; font-size: 14.5px; line-height: 1.55; color: oklch(0.88 0.006 85)\">Engl -filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%); box-shadow: inset 0 1px 0 oklch(0.98 0.01 85 / 0.16); transition: border-color 180ms ease, transform 180ms ease, box-shadow 180ms ease\" style-hover=\"border-color: oklch(0.8 0.13 75 / 0.5); transform: translateY(-3px); box-shadow: inset 0 1px 0 oklch(0.98 0.01 85 / 0.26), 0 18px 46px oklch(0.08 0.01 265 / 0.6)\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 16px\">\n          <h3 style=\"margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 500\">MigrationGuard<\u002Fh3>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.8 0.13 75); border: 1px solid oklch(0.8 0.13 75 / 0.4); padding: 3px 8px\">Building<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin: 16px 0 0; font-size: 15.5px; line-height: 1.64; color: oklch(0.76 0.008 85)\">A CLI tool that catches backward-incompatible database migrations before they break a zero-downtime deploy, by tracing migration diffs back to the application code that depends on them.<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 0\">\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.64 0.01 85); border: 1px solid oklch(0.95 0.01 265 / 0.14); padding: 4px 9px\">Python<\u002Fspan>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.64 0.01 85); border: 1px solid oklch(0.95 0.01 265 / 0.14); padding: 4px 9px\">CLI<\u002Fspan>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.64 0.01 85); border: 1px solid oklch(0.95 0.01 265 / 0.14); padding: 4px 9px\">PostgreSQL<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Farticle>\n      <article style=\"padding: 30px 30px 26px; border: 1px solid oklch(0.95 0.01 265 / 0.12); background: linear-gradient(oklch(0.32 0.02 265 / 0.4), oklch(0.2 0.016 265 / 0.28)); backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%); box-shadow: inset 0 1px 0 oklch(0.98 0.01 85 / 0.16); transition: border-color 180ms ease, transform 180ms ease, box-shadow 180ms ease\" style-hover=\"border-color: oklch(0.8 0.13 75 / 0.5); transform: translateY(-3px); box-shadow: inset 0 1px 0 oklch(0.98 0.01 85 / 0.26), 0 18px 46px oklch(0.08 0.01 265 / 0.6)\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 16px\">\n          <h3 style=\"margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 500\">Interview Helper<\u002Fh3>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.74 0.17 145); border: 1px solid oklch(0.74 0.17 145 / 0.35); padding: 3px 8px\">Active<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin: 16px 0 0; font-size: 15.5px; line-height: 1.64; color: oklch(0.76 0.008 85)\">A local RAG application that stores and queries interview experiences with semantic search and metadata filtering — ingestion, indexing, retrieval, and LLM answers all running on local infrastructure.<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 0\">\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.64 0.01 85); border: 1px solid oklch(0.95 0.01 265 / 0.14); padding: 4px 9px\">Python<\u002Fspan>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.64 0.01 85); border: 1px solid oklch(0.95 0.01 265 / 0.14); padding: 4px 9px\">Ollama<\u002Fspan>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.64 0.01 85); border: 1px solid oklch(0.95 0.01 265 / 0.14); padding: 4px 9px\">ChromaDB<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Farticle>\n      <article style=\"padding: 30px 30px 26px; border: 1px solid oklch(0.95 0.01 265 / 0.12); background: linear-gradient(oklch(0.32 0.02 265 / 0.4), oklch(0.2 0.016 265 / 0.28)); backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%); box-shadow: inset 0 1px 0 oklch(0.98 0.01 85 / 0.16); transition: border-color 180ms ease, transform 180ms ease, box-shadow 180ms ease\" style-hover=\"border-color: oklch(0.8 0.13 75 / 0.5); transform: translateY(-3px); box-shadow: inset 0 1px 0 oklch(0.98 0.01 85 / 0.26), 0 18px 46px oklch(0.08 0.01 265 / 0.6)\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 16px\">\n          <h3 style=\"margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 500\">Librarian<\u002Fh3>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.74 0.17 145); border: 1px solid oklch(0.74 0.17 145 / 0.35); padding: 3px 8px\">Active<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin: 16px 0 0; font-size: 15.5px; line-height: 1.64; color: oklch(0.76 0.008 85)\">A multi-book conversational AI that ingests PDFs, builds a searchable knowledge base, and answers with citations, using hybrid retrieval across vector search, TF-IDF, and cosine similarity.<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 0\">\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.64 0.01 85); border: 1px solid oklch(0.95 0.01 265 / 0.14); padding: 4px 9px\">Python<\u002Fspan>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.64 0.01 85); border: 1px solid oklch(0.95 0.01 265 / 0.14); padding: 4px 9px\">RAG<\u002Fspan>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.64 0.01 85); border: 1px solid oklch(0.95 0.01 265 / 0.14); padding: 4px 9px\">Hybrid Search<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n    <p style=\"margin: 26px 0 0; font-family: 'JetBrains Mono', monospace; font-size: 12.5px\"><a href=\"https://github.com/ajaiswal1818\" target=\"_blank\" rel=\"noopener noreferrer\">More on GitHub →<\u002Fa><\u002Fp>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ showNotes }}\" hint-placeholder-val=\"{{ true }}\">\n    <section id=\"notes\" style=\"max-width: 1304px; margin: 0 auto; padding: 120px 48px 0\">\n      <div style=\"display: flex; align-items: baseline; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid oklch(0.44 0.012 265)\">\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: oklch(0.8 0.13 75)\">04<\u002Fspan>\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: oklch(0.88 0.006 85)\">Field notes<\u002Fspan>\n      <a href=\"https://medium.com/@ajaiswal9043\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase\">All writing on Medium ↗<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px; margin: 48px 0 0\">\n        <article>\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.62 0.01 85)\">Local AI · Systems<\u002Fdiv>\n          <h3 style=\"margin: 14px 0 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 27px; line-height: 1.18; letter-spacing: -0.01em; text-wrap: pretty\">The real bottleneck in local AI isn't model size. It's memory.<\u002Fh3>\n          <p style=\"margin: 16px 0 0; font-size: 15.5px; line-height: 1.66; color: oklch(0.76 0.008 85); text-wrap: pretty\">Running larger coding models on a 16GB Mac Mini, generation slowed and the model lost track of earlier context as the project grew. The cause wasn't the model — it was the KV cache eating available memory as context filled. A smaller model with more headroom can outperform a bigger one on real projects, and the next unlock for local AI is better memory architecture, not bigger weights.<\u002Fp>\n          <p style=\"margin: 22px 0 0; font-family: 'JetBrains Mono', monospace; font-size: 12px\"><a href=\"https://www.linkedin.com/posts/abhijaiswal18_ai-localai-llm-share-7475772170476879873-HkCK/\" target=\"_blank\" rel=\"noopener noreferrer\">Read on LinkedIn ↗<\u002Fa><\u002Fp>\n        <\u002Farticle>\n        <article>\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.62 0.01 85)\">Benchmark · Apple Silicon<\u002Fdiv>\n          <h3 style=\"margin: 14px 0 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 27px; line-height: 1.18; letter-spacing: -0.01em; text-wrap: pretty\">Benchmarking Qwen3.5 on a Mac Mini against my Claude subscription<\u002Fh3>\n          <p style=\"margin: 16px 0 0; font-size: 15.5px; line-height: 1.66; color: oklch(0.76 0.008 85); text-wrap: pretty\">The same coding prompt across 4B and 9B Qwen3.5 models, with and without Apple's MLX backend. Runtime optimization mattered nearly as much as model size.<\u002Fp>\n          <div style=\"margin: 22px 0 0; display: flex; flex-direction: column; gap: 10px\">\n            <div style=\"display: grid; grid-template-columns: 62px minmax(0, 1fr) 82px; gap: 12px; align-items: center\">\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: oklch(0.62 0.01 85)\">No MLX<\u002Fdiv>\n              <div style=\"height: 8px; background: oklch(0.3 0.014 265)\"><div style=\"width: 47%; height: 100%; background: oklch(0.55 0.01 85)\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; text-align: right\">13.13 tok/s<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 62px minmax(0, 1fr) 82px; gap: 12px; align-items: center\">\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: oklch(0.62 0.01 85)\">MLX<\u002Fdiv>\n              <div style=\"height: 8px; background: oklch(0.3 0.014 265)\"><div style=\"width: 100%; height: 100%; background: oklch(0.8 0.13 75)\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; text-align: right\">27.71 tok/s<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin: 16px 0 0; font-size: 15px; line-height: 1.62; color: oklch(0.66 0.008 85)\">~2.1× faster generation on the 4B model; total inference time dropped from 4m39s to 1m43s. 4B models now feel genuinely usable for real engineering work.<\u002Fp>\n          <p style=\"margin: 20px 0 0; font-family: 'JetBrains Mono', monospace; font-size: 12px\"><a href=\"https://www.linkedin.com/posts/abhijaiswal18_ai-llm-ollama-ugcPost-7466018590115262464-5kxm/\" target=\"_blank\" rel=\"noopener noreferrer\">Read on LinkedIn ↗<\u002Fa><\u002Fp>\n        <article>\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.62 0.01 85)\">Medium · Infrastructure<\u002Fdiv>\n          <h3 style=\"margin: 14px 0 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 27px; line-height: 1.18; letter-spacing: -0.01em; text-wrap: pretty\">Putting a desktop GUI game on the web without rewriting a line of it<\u002Fh3>\n          <p style=\"margin: 16px 0 0; font-size: 15.5px; line-height: 1.66; color: oklch(0.76 0.008 85); text-wrap: pretty\">A Snake game built for a local display, served to any browser by wrapping it instead of porting it: VNC to capture the GUI session, nginx in front of it, and ngrok to expose the tunnel. A write-up of the plumbing — and of when wrapping an app beats rewriting it.<\u002Fp>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 0\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.64 0.01 85); border: 1px solid oklch(0.95 0.01 265 / 0.14); padding: 4px 9px\">VNC<\u002Fspan>\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.64 0.01 85); border: 1px solid oklch(0.95 0.01 265 / 0.14); padding: 4px 9px\">nginx<\u002Fspan>\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.64 0.01 85); border: 1px solid oklch(0.95 0.01 265 / 0.14); padding: 4px 9px\">ngrok<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin: 20px 0 0; font-family: 'JetBrains Mono', monospace; font-size: 12px\"><a href=\"https://levelup.gitconnected.com/exposing-a-gui-game-to-the-web-without-rewriting-it-how-i-hosted-snake-via-vnc-ngrok-nginx-9d0697ba9bc9?source=friends_link&amp;sk=824d776e317a47e2d0a36f39a5f35939\" target=\"_blank\" rel=\"noopener noreferrer\">Read on Medium ↗<\u002Fa><\u002Fp>\n        <\u002Farticle>\n      <\u002Farticle><\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <section id=\"contact\" style=\"max-width: 1304px; margin: 0 auto; padding: 140px 48px 0\">\n    <div style=\"display: flex; align-items: baseline; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid oklch(0.44 0.012 265)\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: oklch(0.8 0.13 75)\">05<\u002Fspan>\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: oklch(0.88 0.006 85)\">Contact<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"margin: 56px 0 0\">\n      <h2 style=\"margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: clamp(42px, 6.2vw, 84px); line-height: 1.02; letter-spacing: -0.02em; max-width: 18ch; text-wrap: balance\">Open to senior &amp; staff backend roles in <em style=\"font-style: italic; color: oklch(0.8 0.13 75)\">Barcelona<\u002Fem> and across Europe.<\u002Fh2>\n      <p style=\"margin: 30px 0 0; font-size: 17px; line-height: 1.65; color: oklch(0.76 0.008 85); max-width: 52ch; text-wrap: pretty\">I'm relocating from Bengaluru and ready to start the visa sponsorship process. If you're hiring backend or AI-systems engineers, I'd love to talk.<\u002Fp>\n      <a href=\"mailto:ajaiswal9043@gmail.com\" style=\"display: inline-block; margin: 40px 0 0; font-family: 'Instrument Serif', Georgia, serif; font-size: clamp(24px, 3.4vw, 46px); color: oklch(0.94 0.006 85); border-bottom: 2px solid oklch(0.8 0.13 75); padding-bottom: 8px; transition: color 160ms ease\" style-hover=\"color: oklch(0.8 0.13 75)\">ajaiswal9043@gmail.com<\u002Fa>\n      <div style=\"display: flex; gap: 28px; margin: 44px 0 0; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; letter-spacing: 0.06em; text-transform: uppercase\">\n        <a href=\"https://www.linkedin.com/in/abhijaiswal18/\" target=\"_blank\" rel=\"noopener noreferrer\">LinkedIn ↗<\u002Fa>\n        <a href=\"https://github.com/ajaiswal1818\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub ↗<\u002Fa>\n        <a href=\"https://medium.com/@ajaiswal9043\" target=\"_blank\" rel=\"noopener noreferrer\">Medium ↗<\u002Fa>\n        <a href=\"https://leetcode.com/u/ajaiswal9043/\" target=\"_blank\" rel=\"noopener noreferrer\">LeetCode ↗<\u002Fa>\n        <a href=\"https://codeforces.com/profile/jaiswal_abhi\" target=\"_blank\" rel=\"noopener noreferrer\">Codeforces ↗<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"max-width: 1304px; margin: 110px auto 0; padding: 22px 48px 210px; border-top: 1px solid oklch(0.95 0.01 265 / 0.1); display: flex; align-items: baseline; justify-content: space-between; gap: 24px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: oklch(0.6 0.01 85)\">\n    <div>© 2026 Abhishek Jaiswal · Bengaluru → Barcelona<\u002Fdiv>\n    <div>{{ progressLabel }}<\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;}}\">\nconst STOPS = [\n  { year: \"2017\", label: \"IIT Guwahati\", at: 7 },\n  { year: \"2021\", label: \"VMware · SD-WAN\", at: 35 },\n  { year: \"2025\", label: \"Knowl · Founding Eng\", at: 65 },\n  { year: \"2026\", label: \"Barcelona\", at: 93 },\n];\n\nconst KNOWL = [\n  { num: \"01\", title: \"Client applications\", sub: \"1M+ requests / day\", at: 0 },\n  { num: \"02\", title: \"FastAPI gateway\", sub: \"Pydantic contracts · EC2 + GKE\", at: 1 },\n  { num: \"03\", title: \"Redis rate limiter\", sub: \"Throttling tuned on P95\", at: 2 },\n  { num: \"04\", title: \"Agent orchestrator\", sub: \"LLM reasoning → fallback ladder\", at: 3 },\n];\n\nconst VMWARE = [\n  { num: \"01\", title: \"200,000+ edge devices\", sub: \"VeloCloud SD-WAN fleet\", at: 0 },\n  { num: \"02\", title: \"Kernel-level probe\", sub: \"Interface state in C\", at: 1 },\n  { num: \"03\", title: \"Telemetry → dashboard\", sub: \"Fleet-wide, real time\", at: 2 },\n  { num: \"04\", title: \"Threat engine\", sub: \"IDS/IPS · URL filtering\", at: 3 },\n];\n\nclass Component extends DCLogic {\n  state = { progress: 0, walking: false, aKnowl: 0, aVmware: 0 };\n\n  componentDidMount() {\n    if (this._bound) return;\n    this._bound = true;\n    this._measure = () => {\n      const vp = document.getElementById(\"journey-viewport\");\n      if (!vp) return;\n      const span = vp.scrollHeight - vp.clientHeight;\n      let p = span > 20 ? vp.scrollTop / span : 0;\n      p = Math.min(1, Math.max(0, p));\n      const focus = vp.clientHeight * 0.42;\n      const active = (name) => {\n        const els = document.querySelectorAll('[data-case=\"' + name + '\"]');\n        let best = 0, bestD = Infinity;\n        els.forEach((el) => {\n          const r = el.getBoundingClientRect();\n          const d = Math.abs(r.top + r.height / 2 - focus);\n          if (d < bestD) { bestD = d; best = Number(el.getAttribute(\"data-step\")); }\n        });\n        return best;\n      };\n      const aK = active(\"knowl\");\n      const aV = active(\"vmware\");\n      const moved = Math.abs(p - this.state.progress) > 0.0004;\n      if (moved || aK !== this.state.aKnowl || aV !== this.state.aVmware) {\n        this.setState({ progress: p, walking: moved || this.state.walking, aKnowl: aK, aVmware: aV });\n        clearTimeout(this._idle);\n        this._idle = setTimeout(() => this.setState({ walking: false }), 200);\n      }\n    };\n    document.addEventListener(\"scroll\", this._measure, true);\n    window.addEventListener(\"resize\", this._measure);\n    const vp = document.getElementById(\"journey-viewport\");\n    if (vp) vp.addEventListener(\"scroll\", this._measure, { passive: true });\n    this._poll = setInterval(this._measure, 60);\n    this._measure();\n  }\n\n  componentWillUnmount() {\n    document.removeEventListener(\"scroll\", this._measure, true);\n    window.removeEventListener(\"resize\", this._measure);\n    clearInterval(this._poll);\n    clearTimeout(this._idle);\n  }\n\n  nodes(list, activeStep) {\n    return list.map((n, i) => {\n      const on = activeStep >= n.at;\n      const isFocus = n.at === activeStep;\n      return {\n        num: n.num,\n        title: n.title,\n        sub: n.sub,\n        hasLink: i < list.length - 1,\n        border: isFocus ? \"oklch(0.8 0.13 75 / 0.65)\" : on ? \"oklch(0.95 0.01 265 / 0.16)\" : \"oklch(0.95 0.01 265 / 0.07)\",\n        bg: isFocus\n          ? \"linear-gradient(oklch(0.36 0.03 265 / 0.55), oklch(0.24 0.02 265 / 0.4))\"\n          : on\n          ? \"linear-gradient(oklch(0.3 0.02 265 / 0.34), oklch(0.2 0.016 265 / 0.24))\"\n          : \"oklch(0.22 0.014 265 / 0.14)\",\n        glow: isFocus ? \"inset 0 1px 0 oklch(0.98 0.01 85 / 0.2), 0 0 26px oklch(0.8 0.13 75 / 0.22)\" : \"none\",\n        numColor: on ? \"oklch(0.8 0.13 75)\" : \"oklch(0.42 0.012 265)\",\n        titleColor: on ? \"oklch(0.94 0.006 85)\" : \"oklch(0.5 0.01 85)\",\n        subColor: on ? \"oklch(0.7 0.01 85)\" : \"oklch(0.42 0.012 265)\",\n        linkColor: on ? \"oklch(0.8 0.13 75 / 0.45)\" : \"oklch(0.95 0.01 265 / 0.1)\",\n        packetColor: on ? \"oklch(0.85 0.13 78)\" : \"transparent\",\n        packetDur: (1.5 + i * 0.22).toFixed(2) + \"s\",\n        packetState: on ? \"running\" : \"paused\",\n      };\n    });\n  }\n\n  renderVals() {\n    if (!this._started) { this._started = true; setTimeout(() => this.componentDidMount(), 0); }\n    const t = this.state.progress;\n    const pct = 5 + t * 88;\n    const ink = \"oklch(0.94 0.006 85)\";\n    const accent = \"oklch(0.8 0.13 75)\";\n    const muted = \"oklch(0.48 0.01 85)\";\n    const reached = STOPS.filter((s) => pct >= s.at - 1);\n    const current = reached.length ? reached[reached.length - 1] : null;\n    const hue = 268 - t * 46;\n    const chroma = (0.035 + t * 0.045).toFixed(3);\n    return {\n      skyGradient:\n        \"radial-gradient(125% 92% at 50% 0%, oklch(\" + (0.24 + t * 0.05).toFixed(3) + \" \" + chroma + \" \" + hue.toFixed(1) +\n        \") 0%, oklch(0.17 0.014 \" + (268 - t * 20).toFixed(1) + \") 56%, oklch(0.14 0.014 270) 100%)\",\n      sunColor: \"oklch(\" + (0.62 + t * 0.06).toFixed(3) + \" 0.16 \" + (75 - t * 18).toFixed(1) + \" / 0.24)\",\n      glowY: (-t * 220).toFixed(1) + \"px\",\n      glowY2: (t * 180).toFixed(1) + \"px\",\n      gridY: (-t * 84 * 6).toFixed(1) + \"px\",\n      ridgeFarX: (-t * 340).toFixed(1) + \"px\",\n      ridgeNearX: (-t * 760).toFixed(1) + \"px\",\n      walkerLeft: pct.toFixed(2) + \"%\",\n      trailWidth: \"calc((100% - 96px) * \" + (pct / 100).toFixed(4) + \")\",\n      playState: this.state.walking ? \"running\" : \"paused\",\n      progressLabel: current ? current.year + \" · \" + current.label : \"Bengaluru\",\n      milestones: STOPS.map((s) => {\n        const done = pct >= s.at - 1;\n        return {\n          year: s.year,\n          label: s.label,\n          left: s.at + \"%\",\n          labelColor: done ? ink : muted,\n          yearColor: done ? accent : muted,\n          tickColor: done ? \"oklch(0.58 0.01 85)\" : \"oklch(0.32 0.012 265)\",\n          dotColor: done ? accent : \"oklch(0.34 0.012 265)\",\n          dotGlow: done ? \"0 0 10px oklch(0.8 0.13 75 / 0.8)\" : \"none\",\n        };\n      }),\n      knowlNodes: this.nodes(KNOWL, this.state.aKnowl),\n      vmwNodes: this.nodes(VMWARE, this.state.aVmware),\n      showNotes: this.props.showNotes ?? true,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
